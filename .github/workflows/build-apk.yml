name: Build SWP APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get SWP project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o SWP_Android_GitHub_Build.zip -d swp_project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build SWP APK
        working-directory: swp_project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload SWP APK
        uses: actions/upload-artifact@v4
        with:
          name: SWP-apk
          path: swp_project/app/build/outputs/apk/debug/app-debug.apk
